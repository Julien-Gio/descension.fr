{{- define "main" -}}

{{/* Title and Summary */}}
<div class="single-intro-container">
  <h1 class="single-title">{{ .Title }}</h1>
  {{ with .Param "summary" }}
  <p class="single-summary">{{ . | markdownify }}</p>
  {{ end }}
</div>

<div class="single-content">
  {{ .Content }}
</div>

{{- end }}
