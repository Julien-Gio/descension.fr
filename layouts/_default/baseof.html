<!DOCTYPE html>
<html lang="{{ or site.Language.LanguageCode site.Language.Lang }}">

  <head>
    {{ partial "head.html" . }}
  </head>

  <body>
    <div class="content">
      <header>
        {{ partial "header.html" . }}
      </header>

      <main class="main">
        {{ block "main" . }}{{ end }}
      </main>
    </div>

    <footer>
      {{ partial "footer.html" . }}
    </footer>
  </body>
</html>
