name: Build & Deploy to SurgeSH

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SBCL
        run: |
          sudo apt-get update
          sudo apt-get install -y sbcl

      - name: Build site (Lisp)
        run: |
          sbcl --script run.lisp

      - name: Install Surge
        run: npm install --global surge

      - name: Deploy to Surge
        run: surge ./output/public --token ${{ secrets.SURGE_TOKEN }}
