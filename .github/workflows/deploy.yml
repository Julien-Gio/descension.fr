name: Build & Deploy to SurgeSH

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: |
          sudo apt-get update
          sudo apt-get install -y sbcl
          sbcl --script run.lisp

      - name: Deploy
        run: npm install --global surge
        run: surge ./output/public --token ${{ secrets.SURGE_TOKEN }}
